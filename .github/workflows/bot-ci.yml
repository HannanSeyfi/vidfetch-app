name: Telegram bot CI

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot-ci.yml"]
  pull_request:
    paths: ["bot/**", ".github/workflows/bot-ci.yml"]

permissions:
  contents: read

concurrency:
  group: bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install media tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade --pre -r requirements-hosting.txt
          python -m pip install ruff nbformat
      - name: Check source and notebook
        run: |
          ruff check main.py vidfetch_bot tests tools
          python tools/build_notebook.py --check
      - name: Exercise conversations, downloads, original quality and split delivery
        run: python -m unittest discover -s tests -v

  api-server:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install httpx==0.28.1
      - name: Resolve pinned server revision
        id: server
        run: python -c "from vidfetch_bot.local_api import API_REVISION; print('revision=' + API_REVISION)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vidfetch-bot-api/${{ steps.server.outputs.revision }}/install
          key: telegram-api-ubuntu24-${{ runner.arch }}-${{ steps.server.outputs.revision }}
      - name: Build and smoke-test Telegram's official server
        run: PYTHONPATH=. python tools/check_api_server.py
      - name: Package the official server for persistent Linux hosting
        run: PYTHONPATH=. python tools/package_hosting.py dist/vidfetch-botkeep-linux-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: vidfetch-botkeep-linux-x64
          path: bot/dist/vidfetch-botkeep-linux-x64.zip
          retention-days: 14
