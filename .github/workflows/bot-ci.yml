name: Telegram bot CI

on:
  push:
    branches: [main]
    paths: ["bot/**", ".github/workflows/bot-ci.yml"]
  pull_request:
    paths: ["bot/**", ".github/workflows/bot-ci.yml"]

permissions:
  contents: read

concurrency:
  group: bot-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - name: Install media tools and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade --pre -r requirements.txt
          python -m pip install ruff nbformat
      - name: Check source and notebook
        run: |
          ruff check vidfetch_bot tests tools
          python tools/build_notebook.py --check
      - name: Exercise conversations, downloads, and compression
        run: python -m unittest discover -s tests -v
