name: Android CI

permissions:
  contents: write

on:
  push:
    paths: ["android/**", ".github/workflows/android-ci.yml", "AGENTS.md", ".gitignore"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-ci.yml", "AGENTS.md", ".gitignore"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: ./gradlew test assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vidfetch-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vidfetch-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Name GitHub Release APKs
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p app/build/outputs/release-assets
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk app/build/outputs/release-assets/VidFetch_v8a_0.1.3.apk
          cp app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk app/build/outputs/release-assets/VidFetch_v7a_0.1.3.apk
      - name: Publish Android downloads to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.3-build.${{ github.run_number }}
          name: VidFetch v0.1.3 (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            android/app/build/outputs/release-assets/VidFetch_v8a_0.1.3.apk
            android/app/build/outputs/release-assets/VidFetch_v7a_0.1.3.apk
