name: Android CI

permissions:
  contents: write

on:
  push:
    paths: ["android/**", ".github/workflows/android-ci.yml", "AGENTS.md", ".gitignore"]
  pull_request:
    paths: ["android/**", ".github/workflows/android-ci.yml", "AGENTS.md", ".gitignore"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore permanent release-signing key
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.VIDFETCH_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VIDFETCH_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VIDFETCH_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VIDFETCH_SIGNING_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vidfetch-release.jks"
          echo "VIDFETCH_KEYSTORE_FILE=$RUNNER_TEMP/vidfetch-release.jks" >> "$GITHUB_ENV"
          echo "VIDFETCH_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "VIDFETCH_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "VIDFETCH_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - run: ./gradlew test assembleDebug assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: vidfetch-debug-apks
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: vidfetch-release-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Name GitHub Release APKs
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p app/build/outputs/release-assets
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk app/build/outputs/release-assets/VidFetch_v8a_0.2.2.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk app/build/outputs/release-assets/VidFetch_v7a_0.2.2.apk
      - name: Publish Android downloads to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.2-build.${{ github.run_number }}
          name: VidFetch v0.2.2 (build ${{ github.run_number }})
          generate_release_notes: true
          files: |
            android/app/build/outputs/release-assets/VidFetch_v8a_0.2.2.apk
            android/app/build/outputs/release-assets/VidFetch_v7a_0.2.2.apk
